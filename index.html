<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Block - 方块消除游戏</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: radial-gradient(circle at 50% 20%, #1d4ed8, #08152f 65%);
      color: #eef6ff;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { width: min(640px, 100%); text-align: center; }
    h1 { margin: 0 0 12px; font-size: clamp(38px, 8vw, 72px); letter-spacing: 2px; }
    p { margin: 10px 0; color: #c8dcff; line-height: 1.7; }
    a { color: #7ff5e3; }
  </style>
</head>
<body>
  <main>
    <h1>BLOCK</h1>
    <p>一款方块消除游戏。</p>
    <p><a href="https://github.com/caiyipeng2/Block">项目仓库</a></p>
  </main>
</body>
</html>
